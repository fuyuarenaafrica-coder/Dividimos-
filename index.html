<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>División paso a paso</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#172334;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:1050px;margin:auto}header{background:white;border-radius:16px;padding:22px;border:1px solid #dbe2ec}h1{margin:0 0 6px;font-size:27px}p{line-height:1.45}.muted{color:#546376}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.panel{background:#fff;border:1px solid #dbe2ec;border-radius:16px;padding:20px}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(190px,1fr);gap:16px}.math{overflow:auto;min-height:290px}.division{position:relative;width:390px;max-width:100%;height:245px;margin:10px auto;font-family:Consolas,monospace;font-size:31px}.top{position:absolute;left:14px;top:13px;display:flex;gap:0}.digit{width:29px;text-align:center}.divisor{position:absolute;left:245px;top:13px}.bracket{position:absolute;left:227px;top:10px;width:140px;height:57px;border-left:3px solid #172334;border-bottom:3px solid #172334}.quotient{position:absolute;left:250px;top:78px;color:#1260a4;letter-spacing:2px}.work{position:absolute;left:14px;top:70px;font-size:25px;line-height:34px;white-space:pre;font-family:Consolas,monospace}.workline{height:34px}.active{color:#1260a4;font-weight:bold}.tabletitle{font-weight:bold;margin:0 0 12px}.times{display:grid;gap:5px}.times div{border-radius:7px;background:#f1f5fa;padding:6px 12px;font-size:15px}.question{font-size:19px;font-weight:bold;margin:12px 0}.step{display:inline-block;background:#e8f2fc;color:#124f82;padding:7px 12px;border-radius:9px;font-weight:bold}.inputrow{display:flex;gap:9px;flex-wrap:wrap}.inputrow input{font-size:22px;padding:12px;width:155px;border:2px solid #b5c5d7;border-radius:10px}.btn{border:0;background:#1469a8;color:white;border-radius:10px;padding:12px 17px;font-weight:bold;cursor:pointer;font-size:15px}.btn.secondary{background:#e8edf3;color:#1b3047}.btn:disabled{opacity:.45;cursor:default}.feedback{margin-top:13px;padding:12px;border-radius:9px;background:#edf5fc}.error{background:#fff0e9}.done{background:#edf8ed}.small{font-size:13px}.progress{font-weight:bold;color:#52667d}select{padding:10px;border:1px solid #bdc9d8;border-radius:8px;font-size:15px}button:focus,input:focus,select:focus{outline:3px solid #ffbd53;outline-offset:2px}@media(max-width:700px){.layout{grid-template-columns:1fr}.division{transform:scale(.83);transform-origin:top left;margin-bottom:-35px}.math{min-height:235px}h1{font-size:23px}}</style></head><body><div class="wrap"><header><h1>División paso a paso</h1><p class="muted">Miro → Divido → Multiplico → Calculo cuánto falta → Bajo → Compruebo. Una pregunta cada vez. Tabla del divisor siempre visible.</p></header><div class="bar"><label>Modo <select id="mode"><option value="guided">Ejemplo: 216 ÷ 3</option><option value="practice">Practico con ayudas</option><option value="challenge">Practico de forma autónoma</option></select></label><button class="btn secondary" id="new">Nueva división</button><span class="progress" id="progress"></span></div><div class="layout"><main class="panel"><div class="math"><div class="division"><div class="top" id="digits"></div><div class="bracket"></div><div class="divisor" id="divisor"></div><div class="quotient" id="quotient"></div><div class="work" id="work"></div></div></div><div class="step" id="stepname"></div><div class="question" id="question"></div><div class="inputrow" id="inputs"><input id="answer" type="text" inputmode="numeric" autocomplete="off" aria-label="Tu respuesta"><button class="btn" id="check">Comprobar</button><button class="btn secondary" id="hint">Ver pista</button></div><div id="feedback" aria-live="polite"></div><div class="bar"><button class="btn" id="next" style="display:none">Siguiente paso</button></div></main><aside class="panel"><p class="tabletitle" id="tabletitle">Tabla del 3</p><div class="times" id="times"></div><p class="muted small">Consulta la tabla para dividir y multiplicar. No es necesario hacer los cálculos de memoria.</p></aside></div></div><script>
const $=id=>document.getElementById(id);let dividend=216,divisor=3,stages=[],pos=0,finished=false,visibleWork=[],qShown='',attempts=0,points=0;try{points=Number(localStorage.getItem('division_puntos')||0)}catch(e){}
function build(a,b){const digits=String(a).split('').map(Number);let prefix=0,start=0;while(start<digits.length){prefix=prefix*10+digits[start];start++;if(prefix>=b)break}if(prefix<b){start=digits.length}const arr=[];arr.push({type:'look',name:'MIRO',question:digits[0]<b?`El primer número es ${digits[0]} y es menor que ${b}. ¿Qué número formamos tomando más cifras hasta poder dividir entre ${b}?`:`El primer número es ${digits[0]}. ¿Con qué número empezamos a dividir entre ${b}?`,answer:prefix,hint:`Compara las cifras iniciales con ${b}. Si son menores, toma también la cifra siguiente.`,event:null});let rem=0;let current=prefix;for(let i=start-1;i<digits.length;i++){if(i>start-1){current=rem*10+digits[i];arr.push({type:'down',name:'BAJO',question:`Bajo la siguiente cifra: ¿qué número tengo ahora para dividir entre ${b}?`,answer:current,hint:`Junta el resto anterior con la cifra ${digits[i]} que bajas.`,event:{kind:'down',value:current,i}})}let q=Math.floor(current/b),product=q*b,nextrem=current-product;arr.push({type:'divide',name:'DIVIDO',question:`${current} entre ${b} es igual a… ¿qué número escribo en el cociente?`,answer:q,hint:`Busca en la tabla del ${b} el producto más cercano a ${current} sin pasarte.`,event:{kind:'quot',value:q}});arr.push({type:'multiply',name:'MULTIPLICO',question:`${q} × ${b} = … ¿qué número escribo debajo?`,answer:product,hint:`Busca ${b} × ${q} en la tabla.`,event:{kind:'product',value:product,i}});arr.push({type:'difference',name:'CALCULO CUÁNTO FALTA',question:`De ${product} para llegar a ${current}, ¿cuánto falta?`,answer:nextrem,hint:`Piensa cuánto hay que sumar a ${product} para llegar a ${current}.`,event:{kind:'remain',value:nextrem,i}});rem=nextrem}arr.push({type:'check',name:'COMPRUEBO',question:`El cociente es ${Math.floor(a/b)} y el resto es ${a%b}. ¿Cuánto es ${Math.floor(a/b)} × ${b} + ${a%b}?`,answer:a,hint:'Multiplica el cociente por el divisor y suma el resto.',event:{kind:'end'}});return arr}
function startGame(){const mode=$('mode').value;if(mode==='guided'){dividend=216;divisor=3}else{divisor=1+Math.floor(Math.random()*10);dividend=mode==='challenge'?100+Math.floor(Math.random()*8900):20+Math.floor(Math.random()*900);if(dividend<divisor)dividend+=divisor}stages=build(dividend,divisor);pos=0;finished=false;visibleWork=[];qShown='';attempts=0;$('digits').innerHTML=String(dividend).split('').map(x=>`<span class="digit">${x}</span>`).join('');$('divisor').textContent=divisor;$('tabletitle').textContent='Tabla del '+divisor;$('times').innerHTML=Array.from({length:10},(_,i)=>`<div>${divisor} × ${i+1} = <strong>${divisor*(i+1)}</strong></div>`).join('');render()}
function render(){let s=stages[pos];$('stepname').textContent=s.name;$('question').textContent=s.question;$('answer').value='';$('answer').disabled=false;$('check').style.display='';$('hint').style.display='';$('next').style.display='none';$('feedback').innerHTML='';$('progress').textContent=`Paso ${pos+1} de ${stages.length} · Puntos: ${points}`;$('quotient').textContent=qShown;$('work').innerHTML=visibleWork.map(w=>`<div class="workline">${w}</div>`).join('');$('answer').focus()}
function addEvent(e){if(!e)return;if(e.kind==='quot'){qShown+=String(e.value)}if(e.kind==='product'){visibleWork.push('  '+String(e.value).padStart(3,' '));visibleWork.push('  ───')}if(e.kind==='remain'){visibleWork.push('  '+String(e.value).padStart(3,' '))}if(e.kind==='down'){visibleWork.push('  ↓ '+e.value)}}
function check(){let s=stages[pos],raw=$('answer').value.trim(),num=Number(raw);if(raw===''||!Number.isFinite(num)||!Number.isInteger(num)){$('feedback').innerHTML='<div class="feedback error">Escribe un número entero.</div>';return}attempts++;if(num!==s.answer){$('feedback').innerHTML='<div class="feedback error">Todavía no. Lee la pregunta y consulta la tabla. Puedes usar la pista y volver a intentarlo.</div>';return}addEvent(s.event);if(attempts===1){points+=10;try{localStorage.setItem('division_puntos',String(points))}catch(e){}}$('quotient').textContent=qShown;$('work').innerHTML=visibleWork.map(w=>`<div class="workline">${w}</div>`).join('');$('feedback').innerHTML=`<div class="feedback done">Correcto. ${s.type==='look'?'Ya sabemos con qué número empezamos.':s.type==='divide'?'Escribimos el resultado en el cociente.':s.type==='multiply'?'Escribimos el producto debajo del número que estamos dividiendo.':s.type==='difference'?'Escribimos lo que falta debajo.':s.type==='down'?'Continuamos con la siguiente cifra.':'La división está comprobada.'}</div>`;$('answer').disabled=true;$('check').style.display='none';$('hint').style.display='none';$('next').style.display='';$('next').textContent=pos===stages.length-1?'Otra división':'Siguiente paso';$('progress').textContent=`Paso ${pos+1} de ${stages.length} · Puntos: ${points}`}
$('check').onclick=check;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('answer').disabled)check()});$('hint').onclick=()=>{$('feedback').innerHTML='<div class="feedback">Pista: '+stages[pos].hint+'</div>'};$('next').onclick=()=>{if(pos===stages.length-1)startGame();else{pos++;attempts=0;render()}};$('new').onclick=startGame;$('mode').onchange=startGame;startGame();
</script></body></html>
